<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamei</title>
<script>
  // O Mamei novo agora é o app principal. Remove o SW do beta e volta pra raiz (mantendo o #f= da família).
  (function(){
    var go=function(){ location.replace("../"+location.hash); };
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){ return /\/beta\/$/.test(r.scope); }).map(function(r){ return r.unregister(); }));
      }).then(go, go);
    } else go();
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">Abrindo o Mamei… <a href="../">toque aqui</a> se não abrir.</body>
</html>

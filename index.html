<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F4" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mamei">
<title>Mamei</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<script>
  // Tema antes de pintar (evita piscar): auto = escuro das 19h às 6h.
  (function(){ var m="auto"; try{ m=localStorage.getItem("mamei.theme")||"auto"; }catch(e){}
    var h=new Date().getHours(), dk = m==="escuro" || (m==="auto" && (h>=19||h<6));
    if(dk) document.documentElement.classList.add("dark"); })();
</script>
<style>
  :root{
    --bg:#FAF7F4; --card:#FFFFFF; --card2:#F2EEEA; --ink:#2B2633; --ink2:#6F6878;
    --line:rgba(43,38,51,.09); --tab:rgba(255,255,255,.84); --soft:rgba(255,255,255,.55);
    --lav:#DFD4F8; --lavInk:#5F4589; --pea:#FBD5C1; --peaInk:#954C28;
    --min:#C0E9D6; --minInk:#1F634A; --but:#F1E5B8; --butInk:#725A21;
    --danger:#C0553F; --scrim:rgba(20,14,28,.42);
    color-scheme:light;
  }
  :root.dark{
    --bg:#16131C; --card:#211D29; --card2:#2B2634; --ink:#EEEAF3; --ink2:#A9A2B3;
    --line:rgba(255,255,255,.08); --tab:rgba(33,29,41,.86); --soft:rgba(255,255,255,.10);
    --lav:#423658; --lavInk:#D8C7F9; --pea:#593621; --peaInk:#F9C9A9;
    --min:#244839; --minInk:#A6E0C6; --but:#504727; --butInk:#E6D8A3;
    --danger:#F08A72; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none!important}
  body{background:var(--bg); color:var(--ink); font-family:Nunito,system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; transition:background .4s}
  button,input,textarea,select{font-family:inherit; color:inherit}
  button{cursor:pointer}
  .num{font-variant-numeric:tabular-nums}
  body.lock{overflow:hidden}

  /* ---------- estrutura ---------- */
  .app{max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top,0px) + 18px) 0 calc(118px + env(safe-area-inset-bottom,0px))}
  .pg{padding:0 20px; display:flex; flex-direction:column; gap:18px}
  .pg-title{font-size:32px; font-weight:900; letter-spacing:-.02em; line-height:1.1; margin:0}
  .pg-sub{font-size:14.5px; font-weight:600; color:var(--ink2); margin-top:2px}
  .row{display:flex; align-items:center; gap:10px}
  .between{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .col{display:flex; flex-direction:column}
  .card{background:var(--card); border:1px solid var(--line); border-radius:24px; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
  .card-t{font-size:16px; font-weight:900}
  .cap{font-size:12.5px; font-weight:700; color:var(--ink2)}
  .muted{color:var(--ink2)}
  .link{font-size:13px; font-weight:800; color:var(--lavInk); background:none; border:0; padding:0}
  .pill-btn{font-size:13px; font-weight:800; padding:7px 12px; border-radius:99px; border:0; background:var(--lav); color:var(--lavInk)}
  .pill-btn.min{background:var(--min); color:var(--minInk)}
  .ic{display:inline-grid; place-items:center; flex:none}
  .sq{width:40px; height:40px; border-radius:14px; display:grid; place-items:center; flex:none; font-size:20px; line-height:1}
  .c-pea{background:var(--pea); color:var(--peaInk)} .c-lav{background:var(--lav); color:var(--lavInk)}
  .c-min{background:var(--min); color:var(--minInk)} .c-but{background:var(--but); color:var(--butInk)}
  .c-gray{background:var(--card2); color:var(--ink2)}
  .t-pea{color:var(--peaInk)} .t-lav{color:var(--lavInk)} .t-min{color:var(--minInk)} .t-but{color:var(--butInk)}
  .press{transition:transform .12s ease}
  .press:active{transform:scale(.97)}
  :focus-visible{outline:3px solid var(--lavInk); outline-offset:2px}

  /* segmentado e chips */
  .seg{display:flex; background:var(--card2); border-radius:14px; padding:4px; gap:4px}
  .seg button{flex:1; font-size:14px; font-weight:800; padding:9px 6px; border:0; border-radius:11px; background:transparent; color:var(--ink2)}
  .seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .seg.sm{border-radius:12px; padding:3px; gap:3px} .seg.sm button{font-size:13px; padding:7px 4px; border-radius:10px}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{font-size:13.5px; font-weight:800; padding:9px 14px; border-radius:99px; border:0; background:var(--card2); color:var(--ink2)}
  .chip[aria-pressed="true"]{background:var(--lavInk); color:var(--lav)}
  .chip.pea[aria-pressed="true"]{background:var(--peaInk); color:var(--pea)}
  .chip.min[aria-pressed="true"]{background:var(--minInk); color:var(--min)}
  .chips.fill .chip{flex:1; padding:9px 4px; border-radius:12px; font-size:13px}

  .btn{width:100%; font-size:15px; font-weight:900; padding:15px; border-radius:18px; border:0; background:var(--ink); color:var(--bg)}
  .btn:active{transform:scale(.98)}
  .btn.pea{background:var(--peaInk); color:var(--pea)} .btn.lav{background:var(--lavInk); color:var(--lav)}
  .btn.min{background:var(--minInk); color:var(--min)} .btn.gray{background:var(--card2); color:var(--ink2); font-weight:800}
  .btn.danger{background:var(--card2); color:var(--danger); font-weight:800}
  .btns{display:flex; gap:10px}
  .btns .btn{flex:1} .btns .btn.x2{flex:2}

  .switch{width:48px; height:28px; flex:none; border-radius:99px; background:var(--card2); position:relative; border:0; padding:0; transition:background .2s}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .2s}
  .switch[aria-checked="true"]{background:var(--lavInk)} .switch[aria-checked="true"]::after{left:23px}

  .field{display:flex; flex-direction:column; gap:6px}
  .field label,.lbl{font-size:13px; font-weight:800; color:var(--ink2)}
  .inp{font-size:16px; font-weight:700; padding:13px 14px; border-radius:16px; border:1px solid var(--line); background:var(--card); color:var(--ink); outline:none; width:100%}
  .inp:focus{border-color:var(--lavInk)}
  textarea.inp{resize:none; min-height:90px; font-weight:600; line-height:1.45}

  /* ---------- tab bar ---------- */
  .tabbar{position:fixed; z-index:20; left:50%; transform:translateX(-50%); width:min(calc(100% - 28px), 532px);
    bottom:max(14px, calc(env(safe-area-inset-bottom,0px) + 6px)); height:68px; border-radius:34px; background:var(--tab);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--line); box-shadow:0 10px 30px rgba(30,20,40,.12);
    display:flex; align-items:center; padding:0 6px}
  .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:transparent; color:var(--ink2); padding:0}
  .tabbar .pill{width:46px; height:28px; border-radius:99px; display:grid; place-items:center; transition:background .2s}
  .tabbar span.l{font-size:11px; font-weight:800}
  .tabbar button[aria-current="page"]{color:var(--lavInk)}
  .tabbar button[aria-current="page"] .pill{background:var(--lav)}

  /* ---------- Hoje ---------- */
  .hello{display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
  .greet{font-size:14px; font-weight:700; color:var(--ink2)}
  .bname{font-size:32px; font-weight:900; letter-spacing:-.02em; line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bage{font-size:14px; font-weight:600; color:var(--ink2); background:none; border:0; padding:0; text-align:left}
  .avs{display:flex; align-items:center; padding-bottom:4px; background:none; border:0}
  .av{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:14px; border:2px solid var(--bg); flex:none}
  .avs .av+.av{margin-left:-10px}
  .live{border-radius:28px; padding:18px 20px; display:flex; flex-direction:column; gap:10px; cursor:pointer}
  .live-h{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800}
  .dot{width:8px; height:8px; border-radius:50%; background:currentColor}
  .live-n{font-size:46px; font-weight:900; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums}
  .live .between{flex-wrap:wrap}
  .lbtn{font-size:13px; font-weight:800; padding:9px 14px; border-radius:99px; border:0; background:var(--soft); color:inherit}
  .lbtn.solid.pea{background:var(--peaInk); color:var(--pea)} .lbtn.solid.lav{background:var(--lavInk); color:var(--lav)}
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .stat{border-radius:26px; padding:16px; display:flex; flex-direction:column; gap:4px; min-height:150px; cursor:pointer; border:0; text-align:left}
  .stat .k{font-size:13px; font-weight:800}
  .stat .n{font-size:30px; font-weight:900; letter-spacing:-.02em; line-height:1.1}
  .stat .d{font-size:13px; font-weight:700; opacity:.85}
  .stat .tag{margin-top:auto; align-self:flex-start; font-size:12.5px; font-weight:800; padding:6px 10px; border-radius:99px; background:var(--soft)}
  .bar{margin-top:auto; height:8px; border-radius:99px; background:var(--soft); overflow:hidden; position:relative}
  .bar i{position:absolute; left:0; top:0; bottom:0; background:currentColor; border-radius:99px}
  .acts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .act{display:flex; align-items:center; gap:12px; padding:14px; border-radius:22px; border:1px solid var(--line); background:var(--card); text-align:left; min-width:0}
  .act .sq{width:44px; height:44px; border-radius:15px}
  .act b{display:block; font-size:16px; font-weight:900} .act small{display:block; font-size:12.5px; font-weight:600; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .minis{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .mini{display:flex; align-items:center; justify-content:center; gap:7px; padding:12px 6px; border-radius:18px; border:1px solid var(--line); background:var(--card); font-size:13.5px; font-weight:800}
  .mini .e{font-size:17px; line-height:1}
  .tri{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .tri .n{font-size:24px; font-weight:900; line-height:1.15}
  .hr{border-top:1px solid var(--line); padding-top:12px}
  .tip{background:var(--card2); border-radius:24px; padding:16px 18px; display:flex; gap:14px; align-items:flex-start; border:0; text-align:left; width:100%}
  .tip .w{font-size:12.5px; font-weight:800; color:var(--minInk); letter-spacing:.04em; text-transform:uppercase}
  .tip .x{font-size:14.5px; font-weight:600; line-height:1.45; margin-top:3px}
  .list{background:var(--card); border:1px solid var(--line); border-radius:24px; overflow:hidden}
  .li{display:flex; align-items:center; gap:12px; padding:12px 16px; border:0; border-bottom:1px solid var(--line); width:100%; background:none; text-align:left}
  .li:last-child{border-bottom:0}
  .li:active{background:var(--card2)}
  .li .b{flex:1; min-width:0} .li .t{font-size:15px; font-weight:800} .li .s{font-size:13px; font-weight:600; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .li .r{text-align:right; flex:none} .li .r b{display:block; font-size:14px; font-weight:800} .li .r small{font-size:12px; font-weight:600; color:var(--ink2)}
  .banner{border-radius:18px; padding:12px 14px; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:10px; line-height:1.4}
  .banner button{margin-left:auto; flex:none; border:0; border-radius:12px; padding:8px 12px; font-weight:800; font-size:13px; background:var(--lavInk); color:var(--lav)}
  .empty{text-align:center; padding:26px 10px; color:var(--ink2); font-weight:700}

  /* emojis animados (4 ações principais) */
  .emo{position:relative; display:inline-grid; place-items:center; width:32px; height:32px; font-size:26px; line-height:1}
  .emo i{font-style:normal; display:inline-block}
  .emo::before,.emo::after{position:absolute; pointer-events:none; opacity:0; line-height:1}
  .emo.peito i{animation:emBeat 2.4s ease-in-out infinite}
  .emo.peito::after{content:"💗"; right:-6px; top:-6px; font-size:11px; animation:emZ 2.4s ease-out infinite}
  .emo.mamadeira i{transform-origin:50% 80%; animation:emTilt 2.8s ease-in-out infinite .4s}
  .emo.mamadeira::after{content:"💧"; left:2px; bottom:-4px; font-size:9px; animation:emDrop 2.8s ease-in infinite .4s}
  .emo.sono i{animation:emFloat 3.6s ease-in-out infinite}
  .emo.sono::before,.emo.sono::after{content:"z"; font-weight:900; color:var(--lavInk)}
  .emo.sono::after{right:-8px; top:-8px; font-size:11px; animation:emZ 2.2s ease-out infinite}
  .emo.sono::before{right:-2px; top:-2px; font-size:8px; animation:emZ 2.2s ease-out infinite 1.1s}
  .emo.fralda i{transform-origin:50% 10%; animation:emSwing 2.6s ease-in-out infinite .8s}
  .emo.fralda::after{content:"🧷"; right:-7px; bottom:-5px; font-size:12px; opacity:1; animation:emBeat 2.6s ease-in-out infinite .8s}
  @keyframes emBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
  @keyframes emTilt{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(0)}}
  @keyframes emFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
  @keyframes emZ{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-16px) scale(1.1)}}
  @keyframes emSwing{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
  @keyframes emDrop{0%,60%{opacity:0;transform:translateY(-4px)}75%{opacity:1}100%{opacity:0;transform:translateY(8px)}}

  /* ---------- Diário ---------- */
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .days button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0; border-radius:16px; border:0; background:var(--card2); color:var(--ink)}
  .days button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
  .days span{font-size:11px; font-weight:800; text-transform:uppercase; opacity:.8} .days b{font-size:18px; font-weight:900}
  .tchips{display:flex; gap:8px; flex-wrap:wrap}
  .tchips div{font-size:13px; font-weight:800; padding:7px 12px; border-radius:99px}
  .tl{display:flex; flex-direction:column}
  .tl-i{display:flex; gap:12px; border:0; background:none; padding:0; text-align:left; width:100%}
  .tl-time{width:44px; flex:none; font-size:13.5px; font-weight:800; padding-top:14px; text-align:right}
  .tl-rail{width:14px; flex:none; display:flex; flex-direction:column; align-items:center}
  .tl-rail i{width:2px; background:var(--line)} .tl-rail i:first-child{height:16px} .tl-rail i:last-child{flex:1}
  .tl-rail b{width:10px; height:10px; border-radius:50%; background:currentColor}
  .tl-card{flex:1; min-width:0; margin:4px 0; padding:10px 12px; border-radius:18px; display:flex; align-items:center; gap:10px}
  .tl-card .e{font-size:20px; line-height:1}
  .tl-card .b{flex:1; min-width:0} .tl-card .t{font-size:14.5px; font-weight:900} .tl-card .s{font-size:12.5px; font-weight:700; opacity:.85}
  .tl-card .d{font-size:13px; font-weight:800; flex:none}
  .ongoing .tl-card{outline:2px dashed currentColor; outline-offset:-2px}
  .pat{display:flex; align-items:center; gap:8px}
  .pat .lb{width:30px; font-size:11.5px; font-weight:800; color:var(--ink2); text-transform:uppercase}
  .pat .tr{flex:1; height:24px; border-radius:7px; background:var(--card2); position:relative; overflow:hidden}
  .pat .tr i{position:absolute; top:3px; bottom:3px; border-radius:4px}
  .axis{display:flex; justify-content:space-between; padding-left:38px; font-size:10.5px; font-weight:800; color:var(--ink2)}
  .legend{display:flex; gap:10px; font-size:12px; font-weight:800; color:var(--ink2)}
  .legend span{display:flex; align-items:center; gap:5px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:3px}
  .kpi .v{font-size:22px; font-weight:900}

  /* ---------- Crescer ---------- */
  .agecard{border-radius:28px; padding:20px; display:flex; justify-content:space-between; align-items:center; gap:12px}
  .agecard .big{font-size:40px; font-weight:900; letter-spacing:-.02em; line-height:1}
  .ring{width:86px; height:86px; border-radius:50%; background:var(--soft); display:grid; place-items:center; text-align:center; flex:none; padding:6px}
  .ring span{display:block; font-size:11px; font-weight:800} .ring b{display:block; font-size:13px; font-weight:900; line-height:1.15}
  .phase{position:relative; height:30px}
  .phase .base{position:absolute; left:0; right:0; top:12px; height:6px; border-radius:99px; background:var(--card2)}
  .phase .p{position:absolute; top:9px; height:12px; border-radius:99px; background:var(--pea)}
  .phase .now{position:absolute; top:2px; width:4px; height:26px; margin-left:-2px; border-radius:2px; background:var(--ink)}
  .chk{display:flex; align-items:center; gap:12px; padding:9px 0; border:0; background:none; text-align:left; width:100%}
  .chk .box{width:26px; height:26px; flex:none; border-radius:9px; border:2px solid var(--line); display:grid; place-items:center; color:var(--card)}
  .chk[aria-checked="true"] .box{background:var(--minInk); border-color:var(--minInk)}
  .chk .t{flex:1; font-size:14.5px; font-weight:700}
  .chk .w{font-size:12px; font-weight:700; color:var(--ink2); flex:none}
  .vac{display:flex; align-items:center; gap:12px; padding:8px 0; border:0; background:none; text-align:left; width:100%}
  .vac .sq{width:34px; height:34px; border-radius:12px}
  .vac .t{font-size:14.5px; font-weight:800} .vac .s{font-size:12.5px; font-weight:600; color:var(--ink2)}
  .vac .st{font-size:12.5px; font-weight:800; flex:none}
  .chart svg{width:100%; height:auto; display:block}

  /* ---------- Calma ---------- */
  .noise{background:var(--lav); color:var(--lavInk); border-radius:30px; padding:22px 18px 18px; display:flex; flex-direction:column; align-items:center; gap:16px}
  .play{position:relative; width:132px; height:132px; display:grid; place-items:center}
  .play .ring2{position:absolute; inset:0; border-radius:50%; background:var(--lavInk); opacity:0}
  .playing .play .ring2{animation:mmPulse 2.4s ease-out infinite} .playing .play .ring2+.ring2{animation-delay:1.2s}
  .play button{position:relative; width:132px; height:132px; border-radius:50%; border:0; background:var(--lavInk); color:var(--lav); display:grid; place-items:center}
  .sounds{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%}
  .sounds button,.timers button{font-size:13.5px; font-weight:800; padding:11px 6px; border-radius:16px; border:0; background:var(--soft); color:var(--lavInk)}
  .sounds button[aria-pressed="true"],.timers button[aria-pressed="true"]{background:var(--lavInk); color:var(--lav)}
  .timers{display:flex; gap:6px} .timers button{flex:1; padding:8px 2px; border-radius:12px; font-size:12.5px}
  input[type=range]{accent-color:var(--lavInk); flex:1}
  .nl{background:#1B1720; color:#F3E7DA; border-radius:30px; padding:20px 18px; display:flex; flex-direction:column; gap:16px}
  .nl .orb{width:64px; height:64px; border-radius:50%; flex:none}
  .nl .opts{display:flex; gap:8px} .nl .opts button{flex:1; font-size:13.5px; font-weight:800; padding:10px; border-radius:14px; border:2px solid transparent; background:rgba(255,255,255,.06); color:#F3E7DA}
  .nl .go{font-size:16px; font-weight:900; padding:15px; border-radius:18px; border:0; background:#F3E7DA; color:#1B1720}

  .sh-b{display:flex; flex-direction:column; gap:16px}
  .center{display:flex; flex-direction:column; align-items:center; gap:18px}
  .hint{font-size:13.5px; font-weight:800; padding:8px 14px; border-radius:99px}
  .big-n{font-size:56px; font-weight:900; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums}

var M=60e3, H=36e5, D=864e5;
function pad(n){ return (n<10?"0":"")+n; }
function hm(t){ var d=new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dur(ms){ var m=Math.max(0,Math.round(ms/M)); return m<60? m+" min" : Math.floor(m/60)+"h "+pad(m%60); }
function clock(ms){ var s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h? h+":"+pad(m) : pad(m))+":"+pad(s%60); }
function ago(ms){ var m=Math.round(ms/M); if(m<1) return "agora"; if(m<60) return "há "+m+" min"; var h=Math.floor(m/60); if(h<24) return "há "+h+"h "+pad(m%60); var d=Math.floor(h/24); return "há "+d+"d "+(h%24)+"h"; }

function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function dmy(ts){ var d=new Date(ts); return d.getDate()+" "+MES[d.getMonth()]; }

function ageDays(){ if(!S.cfg.birth) return null; var d=Math.floor((Date.now()-new Date(S.cfg.birth+"T00:00:00").getTime())/D); return d<0?0:d; }
function wakeWindow(days){
  if(days<28) return [40,60];
  var w=days/7; if(w<8) return [60,90]; if(w<13) return [75,105]; if(w<17) return [90,120];
  var mo=days/30.44;
  if(mo<5) return [105,135]; if(mo<6) return [120,150]; if(mo<7) return [135,165]; if(mo<9) return [150,180];
  if(mo<12) return [165,210]; if(mo<15) return [180,240]; if(mo<18) return [210,270]; return [240,300];
}
function feedDefaultInterval(days){ var mo=days/30.44; if(mo<1) return 2.5*H; if(mo<4) return 3*H; if(mo<6) return 3.5*H; return 4*H; }
function ageText(d){
  if(d==null) return "";
  if(d<14) return d===0? "recém-nascido" : d+(d===1?" dia":" dias")+" de vida";
  if(d<91){ var w=Math.floor(d/7); return w+" semanas · "+d+" dias de vida"; }
  var mo=Math.floor(d/30.44); if(mo<24) return mo+(mo===1?" mês":" meses")+" · "+Math.floor(d/7)+" semanas";
  var y=Math.floor(mo/12), r=mo%12; return y+(y===1?" ano":" anos")+(r?" e "+r+(r===1?" mês":" meses"):"");
}
function ageShort(d){ if(d==null) return ""; if(d<14) return d+(d===1?" dia":" dias"); if(d<91){ var w=Math.floor(d/7); return w+" semanas"; } var mo=Math.floor(d/30.44); if(mo<24) return mo+(mo===1?" mês":" meses"); var y=Math.floor(mo/12); return y+(y===1?" ano":" anos"); }

var store={
  add:function(ev){
    ev.day=dayKey(ev.ts); if(ev.note==null) ev.note="";
    if(S.mode==="sync"){ var ref=doc(collection(S.db,evPath())); ev.id=ref.id; setDoc(ref, stripId(ev)).catch(writeErr); touchMember(ev);
      S.events.unshift(Object.assign({},ev)); sortDesc(S.events); onData(); return ev.id; }

    if(patch.ts!=null) patch.day=dayKey(patch.ts);
    if(S.mode==="sync") updateDoc(doc(S.db,evPath()+"/"+id), patch).catch(writeErr);
    S.events.forEach(function(e){ if(e.id===id) Object.assign(e,patch); });

/* =====================================================================

function K(e){
  if(e.type==="feed"){ if(e.kind) return e.kind; return /mamadeira|f[óo]rmula/i.test(e.detail||"")? "mamadeira" : "peito"; }
  if(e.type==="note" && e.kind==="pump") return "bomba";
  return {sleep:"sono", pee:"xixi", poop:"coco", note:"nota", measure:"medida"}[e.type] || "nota";
}
var TY={ peito:{e:"🤱",c:"pea"}, mamadeira:{e:"🍼",c:"pea"}, bomba:{e:"🥛",c:"pea"}, sono:{e:"😴",c:"lav"},
  xixi:{e:"💧",c:"min"}, coco:{e:"💩",c:"but"}, ambos:{e:"🧷",c:"but"}, nota:{e:"📝",c:"gray"}, medida:{e:"⚖️",c:"min"} };
function hasSides(e){ return e.E!=null || e.D!=null || e.run; }
function sideMs(e,k,now){ if(!e) return 0; return (e[k]||0) + (e.run===k && e.seg ? ((e.endTs||now)-e.seg) : 0); }
function feedMs(e,now){ if(K(e)==="mamadeira") return 0; if(hasSides(e)) return sideMs(e,"E",now)+sideMs(e,"D",now); return (e.endTs||now)-e.ts; }
function endSide(e){ if(e.end) return e.end; var d=(e.detail||"").toLowerCase(); if(d.indexOf("esq")>=0) return "E"; if(d.indexOf("dir")>=0) return "D"; return null; }
function openFeed(){ for(var i=0;i<S.events.length;i++){ var e=S.events[i]; if(e.type==="feed" && !e.endTs) return e; } return null; }
function openSleep(){ for(var i=0;i<S.events.length;i++){ var e=S.events[i]; if(e.type==="sleep" && !e.endTs) return e; } return null; }
function lastWhere(fn){ for(var i=0;i<S.events.length;i++){ if(fn(S.events[i])) return S.events[i]; } return null; }
function lastPeitoEnd(){ var e=lastWhere(function(x){ return x.type==="feed" && x.endTs && K(x)==="peito" && endSide(x); }); return e? endSide(e) : null; }
function nextSide(){ var end=lastPeitoEnd(); if(!end) return "E"; return S.cfg.sideRule==="outro"? (end==="E"?"D":"E") : end; }
function sideName(k){ return k==="E"?"esquerdo":"direito"; }
function sleepEnd(e,now){ return e.endTs||now; }
function isNight(ts){ var h=new Date(ts).getHours(); return h>=19||h<6; }
function isDiaper(e){ return e.type==="pee"||e.type==="poop"; }
var COLORS={amarelo:["Amarelo","#E2B93B"], verde:["Verde","#8DA54A"], marrom:["Marrom","#8A5A3B"], outra:["Outra cor","#BDB5C2"]};

// junta xixi+cocô registrados juntos ("Os dois") numa linha só
function grouped(list){
  var out=[], seen={};
  list.forEach(function(e){
    if(seen[e.id]) return;
    if(isDiaper(e) && e.pair){
      var mate=list.filter(function(x){ return x.pair===e.pair && x.id!==e.id; })[0];
      if(mate){ seen[mate.id]=1; out.push({_both:true, ts:e.ts, id:(e.type==="poop"?e.id:mate.id), poop:(e.type==="poop"?e:mate), pee:(e.type==="pee"?e:mate)}); return; }
    }
    out.push(e);
  });
  return out;
}

function evView(e,now){
  now=now||Date.now();
  if(e._both){ var c=e.poop.color&&COLORS[e.poop.color]; return {k:"ambos", e:"🧷", c:"but", title:"Xixi + cocô", sub: c? "cocô "+c[0].toLowerCase() : "troca de fralda", dur:"", ts:e.ts, id:e.id}; }
  var k=K(e), t=TY[k], v={k:k, e:t.e, c:t.c, ts:e.ts, id:e.id, dur:"", ongoing:false};
  switch(k){
    case "peito":
      v.title="Peito"; v.ongoing=!e.endTs;
      if(hasSides(e)){
        var o=(e.first||"E")==="E"?["E","D"]:["D","E"];
        var parts=o.filter(function(s){ return sideMs(e,s,now)>0; }).map(function(s){ return s+" "+Math.round(sideMs(e,s,now)/M)+" min"; });
        v.sub = v.ongoing? (e.run? "mamando · lado "+e.run : "pausada") : hm(e.ts)+"–"+hm(e.endTs)+" · "+parts.join(" · ")+(endSide(e)? " · terminou no "+endSide(e):"");
      } else { v.title="Mamada"; v.sub = v.ongoing? "desde "+hm(e.ts) : hm(e.ts)+"–"+hm(e.endTs)+(e.detail? " · "+e.detail:""); }
      v.dur=dur(feedMs(e,now)); break;
    case "mamadeira":
      v.title="Mamadeira"; v.sub=(e.ml!=null? e.ml+" ml · ":"")+(e.milk==="formula"||/f[óo]rmula/i.test(e.detail||"")? "fórmula":"leite materno"); v.dur=e.ml!=null? e.ml+" ml":""; break;
    case "bomba": v.title="Extração"; v.sub="E "+(e.E||0)+" ml · D "+(e.D||0)+" ml"; v.dur=((e.E||0)+(e.D||0))+" ml"; break;
    case "sono":
      v.ongoing=!e.endTs; v.title= (e.night!=null? e.night : isNight(e.ts))? "Sono noturno":"Soneca";
      v.sub= v.ongoing? "desde "+hm(e.ts) : hm(e.ts)+"–"+hm(e.endTs); v.dur=dur(sleepEnd(e,now)-e.ts); break;
    case "xixi": v.title="Xixi"; v.sub="troca de fralda"; break;

function tapSide(k){
  var now=Date.now(), f=openFeed();
  if(!f){
    var sl=openSleep(); if(sl) store.update(sl.id,{endTs:now});
    var ev={type:"feed", kind:"peito", ts:now, endTs:null, E:0, D:0, run:k, seg:now, first:k, end:k, detail:"", note:""};
    var id=store.add(ev); toast("Começou a mamar · lado "+k, function(){ store.remove(id); }); return;
  }
  var p={};
  if(!hasSides(f)){ p.kind="peito"; p.E=0; p.D=0; p[k]=now-f.ts; p.first=k; p.end=k; p.run=k; p.seg=now; store.update(f.id,p); return; }
  if(f.run===k){ p[k]=(f[k]||0)+now-f.seg; p.run=null; p.seg=null; }
  else { if(f.run) p[f.run]=(f[f.run]||0)+now-f.seg; p.run=k; p.seg=now; p.end=k; if(!f.first) p.first=k; }
  store.update(f.id,p);
}
function sidesDetail(E,Dm){ return E>0&&Dm>0? "Ambos" : E>0? "Peito esq." : Dm>0? "Peito dir." : ""; }
function finishFeed(silent){
  var now=Date.now(), f=openFeed(); if(!f){ if(!silent) toast("Toque num lado para começar"); return; }
  if(!hasSides(f)){ store.update(f.id,{endTs:now}); if(!silent) toast("Mamada salva · "+dur(now-f.ts)); return; }
  var E=sideMs(f,"E",now), Dm=sideMs(f,"D",now);
  if(E+Dm<3000){ store.remove(f.id); if(!silent) toast("Mamada muito curta — descartada"); closeSheet(); return; }
  store.update(f.id,{E:E, D:Dm, run:null, seg:null, endTs:now, end:f.end||f.run||f.first, detail:sidesDetail(E,Dm)});
  if(!silent){ toast("Mamada salva · "+dur(E+Dm), function(){ store.update(f.id,{endTs:null}); }); closeSheet(); }
}
function discardFeed(){ var f=openFeed(); if(f) store.remove(f.id); closeSheet(); toast("Mamada descartada"); }
function startSleep(){
  var sl=openSleep(); if(sl){ openSheet("sono"); return; }
  if(openFeed()) finishFeed(true);
  var now=Date.now(), id=store.add({type:"sleep", ts:now, endTs:null, night:isNight(now), note:""});
  openSheet("sono"); toast("Dormiu · "+hm(now), function(){ store.remove(id); closeSheet(); });
}
function wake(){ var sl=openSleep(); if(!sl) return; var now=Date.now(); store.update(sl.id,{endTs:now}); closeSheet();
  toast("Dormiu "+dur(now-sl.ts), function(){ store.update(sl.id,{endTs:null}); }); }

function growthCard(d){
  var html='<div class="card" style="padding:16px 14px"><div class="between" style="padding:0 4px"><div class="card-t">Curvas de crescimento</div><button class="pill-btn min" data-a="sheet" data-v="medidas">+ Medida</button></div>';
  if(!S.cfg.sex){ return html+'<div style="padding:0 4px" class="col"><div class="muted" style="font-weight:600;margin-bottom:10px">As curvas da OMS são diferentes para meninas e meninos.</div>'+chips([["f","Menina"],["m","Menino"]],"","setSex")+'</div></div>'; }
  var mt=S.metric, key={kg:"weight",cm:"height",pc:"head"}[mt];
  html+=seg([["kg","Peso"],["cm","Comprimento"],["pc","Perímetro"]], mt, "metric", "sm");
  var birthT=new Date(S.cfg.birth+"T00:00:00").getTime();
  var pts=allMeasures().filter(function(e){ return e[key]!=null; }).map(function(e){ return {d:Math.max(0,(e.ts-birthT)/D), v:e[key]}; }).filter(function(p){ return p.d<=731; });
  var maxD=Math.min(730, Math.max(91.3, Math.ceil((Math.max(d, pts.length?pts[pts.length-1].d:0)+20)/30.44)*30.44));
  var W=320,Hh=190,L=30,R=8,T=8,B=22, X=function(x){ return L+x/maxD*(W-L-R); };
  var lo=Infinity, hi=-Infinity, steps=40, curves=[[],[],[],[],[]];
  for(var i=0;i<=steps;i++){ var dd=i/steps*maxD, lms=whoLMS(mt,S.cfg.sex,dd); for(var p=0;p<5;p++){ var v=whoVal(lms,PZ[p]); curves[p].push([dd,v]); if(v<lo) lo=v; if(v>hi) hi=v; } }
  pts.forEach(function(p){ if(p.v<lo) lo=p.v; if(p.v>hi) hi=p.v; });
  var stepY={kg:maxD>200?2:1, cm:maxD>200?10:5, pc:2}[mt]; lo=Math.floor(lo/stepY)*stepY; hi=Math.ceil(hi/stepY)*stepY;
  var Y=function(v){ return T+(1-(v-lo)/(hi-lo))*(Hh-T-B); };
  var svg='';
  for(var gv=lo; gv<=hi+1e-9; gv+=stepY) svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(gv).toFixed(1)+'" y2="'+Y(gv).toFixed(1)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(gv)+4).toFixed(1)+'" text-anchor="end" fill="var(--ink2)" style="font:700 10px Nunito,sans-serif">'+gv+'</text>';
  function band(a,b){ return curves[a].concat(curves[b].slice().reverse()).map(function(q){ return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1); }).join(" "); }
  svg+='<polygon points="'+band(0,4)+'" fill="var(--lav)" opacity=".55"/><polygon points="'+band(1,3)+'" fill="var(--lav)"/>';
  svg+='<polyline points="'+curves[2].map(function(q){ return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1); }).join(" ")+'" fill="none" stroke="var(--lavInk)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  var mStep= maxD>400? 6 : maxD>200? 3 : 1;
  for(var mo=0; mo*30.44<=maxD+1; mo+=mStep){ var xx=X(mo*30.44); svg+='<text x="'+xx.toFixed(1)+'" y="'+(Hh-6)+'" text-anchor="'+(mo===0?"start":(mo+mStep)*30.44>maxD+1?"end":"middle")+'" fill="var(--ink2)" style="font:700 10px Nunito,sans-serif">'+(mo===0?"0":mo+" m")+'</text>'; }
  if(pts.length) svg+='<polyline points="'+pts.map(function(q){ return X(q.d).toFixed(1)+","+Y(q.v).toFixed(1); }).join(" ")+'" fill="none" stroke="var(--peaInk)" stroke-width="2.5" stroke-linejoin="round"/>'
    +pts.map(function(q){ return '<circle cx="'+X(q.d).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="4.5" fill="var(--peaInk)" stroke="var(--card)" stroke-width="2"/>'; }).join("");
  var latest="—", pct="nenhuma medida ainda";
  if(pts.length){ var lp=pts[pts.length-1], lms2=whoLMS(mt,S.cfg.sex,lp.d), pv=PZ.map(function(z){ return whoVal(lms2,z); });
    latest= mt==="kg"? nf(lp.v,2)+" kg" : nf(lp.v,1)+" cm";
    pct= lp.v<pv[0]? "abaixo do P3" : lp.v>pv[4]? "acima do P97" : "";
    if(!pct) for(var q=0;q<4;q++){ if(lp.v>=pv[q] && lp.v<=pv[q+1]){ pct="entre "+PN[q]+" e "+PN[q+1]; break; } }
    pct+=" · dia "+Math.round(lp.d); }
  html+='<div class="between" style="padding:0 4px;align-items:baseline"><div style="font-size:28px;font-weight:900">'+latest+'</div><div style="font-size:13px;font-weight:800" class="t-lav">'+pct+'</div></div>'
    +'<div class="chart"><svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Curva de crescimento">'+svg+'</svg></div>'
    +'<div class="cap" style="padding:0 4px;font-weight:600">Faixas: percentis 3–97 e 15–85 da OMS para '+(S.cfg.sex==="m"?"meninos":"meninas")+'. Linha tracejada: mediana. '+(mt==="pc"?"":"")+'</div></div>';
  return html;
}

function shareReport(){
  var r=S.arg.report; if(!r) return; var o=reportData(r), d=ageDays();
  var t="📋 Resumo — "+babyName()+(d!=null?" ("+ageShort(d)+")":"")+"\n"+fmtDate(r.start)+" a "+fmtDate(r.end)+" ("+o.span+"d)\n";
  t+="\n🍼 Mamadas: "+o.F.length+" ("+nf(o.F.length/o.span,1)+"/dia)"; if(o.PD.length) t+=", peito em média "+dur(o.pMs/o.PD.length); if(o.ml) t+=" · "+o.ml+" ml em mamadeira";
  t+="\n😴 Sono: "+(o.sMs?dur(o.sMs/o.span):"—")+"/dia · maior bloco "+(o.maxS?dur(o.maxS):"—");
  t+="\n💧 Xixi: "+o.pee+" ("+nf(o.pee/o.span,1)+"/dia)  💩 Cocô: "+o.poop+" ("+nf(o.poop/o.span,1)+"/dia)";
  var mz=allMeasures().filter(function(e){ return e.weight!=null; }); if(mz.length) t+="\n⚖️ Peso atual: "+nf(mz[mz.length-1].weight,2)+" kg";
  t+="\n\nvia mamei.com.br";
  if(navigator.share) navigator.share({title:"Resumo para o pediatra", text:t}).catch(function(){});
  else if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast("Resumo copiado! Cole no WhatsApp."); }).catch(function(){ prompt("Copie o resumo:",t); });
  else prompt("Copie o resumo:",t);
}
function kv(k,v){ return '<div class="rep-kv"><span class="k">'+k+'</span><span class="v">'+esc(String(v))+'</span></div>'; }
function openReport(r){
  if(!r) return; var o=reportData(r), d=ageDays(), h='';
  h+='<div class="rep-h1">'+esc(babyName())+'</div><div class="rep-meta">'+(d!=null?esc(ageText(d))+" · ":"")+'Período: '+fmtDate(r.start)+' – '+fmtDate(r.end)+' ('+o.span+(o.span===1?" dia":" dias")+')</div>';
  h+='<div class="rep-sec"><h4>🍼 Alimentação</h4><div class="rep-grid">'+kv("Mamadas no período",o.F.length)+kv("Média por dia",nf(o.F.length/o.span,1))
    +kv("No peito",o.P.length)+kv("Duração média no peito",o.PD.length?dur(o.pMs/o.PD.length):"—")+kv("Mamadeiras",o.B.length)+kv("Total em mamadeira",o.ml?o.ml+" ml":"—")
    +kv("Maior intervalo",o.maxGap?dur(o.maxGap):"—")+(o.pump?kv("Leite extraído",o.pump+" ml"):"")+'</div></div>';
  h+='<div class="rep-sec"><h4>😴 Sono</h4><div class="rep-grid">'+kv("Média por dia",o.sMs?dur(o.sMs/o.span):"—")+kv("Sonos no período",o.Sl.length)+kv("Maior bloco",o.maxS?dur(o.maxS):"—")+'</div></div>';
  h+='<div class="rep-sec"><h4>💧 Fraldas</h4><div class="rep-grid">'+kv("Xixis",o.pee)+kv("Xixis por dia",nf(o.pee/o.span,1))+kv("Cocôs",o.poop)+kv("Cocôs por dia",nf(o.poop/o.span,1))+'</div></div>';
  var ms=allMeasures().filter(function(e){ return e.ts>=r.start && e.ts<=r.end; });
  h+='<div class="rep-sec"><h4>⚖️ Medidas</h4>'+(ms.length? '<ul class="rep-list">'+ms.slice().reverse().map(function(m){ return '<li><time>'+fmtDate(m.ts)+'</time><span>'+esc(measureText(m))+'</span></li>'; }).join("")+'</ul>' : '<div class="rep-empty">Nenhuma medida no período.</div>')+'</div>';
  var notes=o.it.filter(function(e){ return K(e)==="nota"; });
  h+='<div class="rep-sec"><h4>📝 Anotações</h4>'+(notes.length? '<ul class="rep-list">'+notes.map(function(n){ return '<li><time>'+fmtDate(n.ts)+" "+hm(n.ts)+'</time><span>'+esc((n.tag&&n.tag!==n.note? n.tag+": ":"")+(n.note||""))+'</span></li>'; }).join("")+'</ul>' : '<div class="rep-empty">Nenhuma anotação no período.</div>')+'</div>';
  var dm={}, order=[];
  o.it.forEach(function(e){ var k=dayKey(e.ts); if(!dm[k]){ dm[k]={f:0,s:0,p:0,c:0}; order.push(k); } if(e.type==="feed") dm[k].f++; if(e.type==="sleep"&&e.endTs) dm[k].s+=e.endTs-e.ts; if(e.type==="pee") dm[k].p++; if(e.type==="poop") dm[k].c++; });
  order.sort();
  if(order.length) h+='<div class="rep-sec"><h4>📅 Dia a dia</h4><table class="rep-table"><thead><tr><th>Dia</th><th>🍼</th><th>😴</th><th>💧</th><th>💩</th></tr></thead><tbody>'
    +order.map(function(k){ var x=dm[k], p=k.split("-"); return '<tr><td>'+p[2]+"/"+p[1]+'</td><td>'+x.f+'</td><td>'+(x.s?dur(x.s):"—")+'</td><td>'+x.p+'</td><td>'+x.c+'</td></tr>'; }).join("")+'</tbody></table></div>';
  h+='<div class="rep-foot">Gerado pelo Mamei · mamei.com.br · '+fmtDate(Date.now())+" "+hm(Date.now())+'.<br>Registro feito pelos pais — não substitui avaliação do pediatra.</div>';
  byId("reportBody").innerHTML=h; byId("report").hidden=false;
}
byId("reportClose").addEventListener("click", function(){ byId("report").hidden=true; });
byId("reportPrint").addEventListener("click", function(){ window.print(); });

/* =====================================================================
   Onboarding (1º acesso)
   ===================================================================== */
var OB={step:0, name:"", birth:"", sex:null};
function maybeOnboarding(){
  var seen=false; try{ seen=!!localStorage.getItem("mamei.onboarded") || !!localStorage.getItem("bebe.onboarded"); }catch(e){}
  if(seen || !byId("ob").hidden) return;
  if(S.cfg.name && S.cfg.birth){ try{ localStorage.setItem("mamei.onboarded","1"); }catch(e){} return; }
  showOnboarding();
}
function showOnboarding(){ OB={step:0, name:S.cfg.name||"", birth:S.cfg.birth||"", sex:S.cfg.sex}; byId("ob").hidden=false; renderOb(); }
function renderOb(){
  var s=OB.step, body='';
  if(s===0) body='<div class="blobs"><i style="left:20px;top:20px;width:150px;height:150px;background:var(--lav)"></i><i style="left:130px;top:60px;width:120px;height:120px;background:var(--pea)"></i><i style="left:200px;top:0;width:90px;height:90px;background:var(--min)"></i></div>'
    +'<h1>Bem-vindos ao Mamei</h1><p>O diário do seu bebê. Mamadas, sono e fraldas anotados com um toque, e acompanhados por quem cuida junto.</p>';
  if(s===1) body='<h2>Como vamos chamar o bebê?</h2><input class="inp" id="ob_name" placeholder="Nome" maxlength="28" value="'+esc(OB.name)+'" style="font-size:22px;font-weight:800;padding:16px 18px;border-radius:20px">'
    +'<div class="lbl" style="font-size:14px">Data de nascimento</div><input class="inp" type="date" id="ob_birth" value="'+esc(OB.birth)+'" style="font-size:17px;padding:14px 18px;border-radius:20px">'
    +'<div class="lbl" style="font-size:14px">É menina ou menino?</div>'+chips([["f","Menina"],["m","Menino"]], OB.sex, "obSex", "fill")
    +'<p style="font-size:13.5px">Com a data, o app calcula a janela de sono, os marcos e as vacinas pela idade.</p>';
  if(s===2) body='<h2>Tudo com um toque</h2>'+[["🤱","pea","Um toque registra o horário","Mamada, sono e fralda sem digitar nada."],["👨‍👩‍👧","lav","Quem cuida vê o mesmo diário","Convide o pai, a avó, a babá."],["📈","min","Resumo pronto para o pediatra","Médias e curvas da OMS em um toque."]]
    .map(function(f){ return '<div class="feat"><span class="sq c-'+f[1]+'">'+f[0]+'</span><div><b>'+f[2]+'</b><span>'+f[3]+'</span></div></div>'; }).join("");
  byId("ob").innerHTML='<div class="ob-in"><div class="between"><div class="ob-dots">'+[0,1,2].map(function(i){ return '<i class="'+(i===s?"on":"")+'"></i>'; }).join("")+'</div><button class="link" data-a="obSkip" style="color:var(--ink2);font-size:14px">Pular</button></div>'
    +'<div class="ob-body">'+body+'</div><button class="btn" data-a="obNext" style="font-size:17px;padding:17px;border-radius:20px">'+(s===2?"Começar":"Próximo")+'</button></div>';
}
function obCapture(){ if(byId("ob_name")) OB.name=byId("ob_name").value.trim(); if(byId("ob_birth")) OB.birth=byId("ob_birth").value; }
A.obSex=function(v){ obCapture(); OB.sex=v; pressIn("obSex",v); };
A.obSkip=function(){ obCapture(); obFinish(); };
A.obNext=function(){ obCapture(); if(OB.step<2){ OB.step++; renderOb(); return; } obFinish(); };
function obFinish(){
  var p={}; if(OB.name) p.name=OB.name; if(OB.birth) p.birth=OB.birth; if(OB.sex) p.sex=OB.sex;
  if(Object.keys(p).length) saveCfg(p);
  try{ localStorage.setItem("mamei.onboarded","1"); }catch(e){}
  byId("ob").hidden=true; S.tab="hoje"; render(); window.scrollTo(0,0);
}

/* =====================================================================
   Início
   ===================================================================== */
applyTheme();
render();
boot();
setInterval(function(){
  if(NOISE.playing && NOISE.endAt && Date.now()>=NOISE.endAt){ noiseStop(); toast("Ruído desligado pelo timer"); }
  tick();
}, 1000);
setInterval(function(){
  if(document.visibilityState!=="visible") return;
  applyTheme(); checkReminders();
  var busy=document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!busy) renderTab();
}, 30000);
if("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(e){ console.warn("SW",e); }); });
})();
</script>
</body>
